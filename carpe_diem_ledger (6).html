<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpe Diem Ledger</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat (Safe for standalone HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .parchment-bg { 
            background-color: #f4ebd0; 
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
        }
        .steampunk-border { 
            border: 4px solid #8b5a2b; 
            box-shadow: inset 0 0 0 2px #f4ebd0, inset 0 0 0 4px #8b5a2b, 4px 4px 10px rgba(62,39,35,0.3);
        }
        .steampunk-card { 
            background: rgba(253, 248, 237, 0.95); 
            border: 2px solid #8b5a2b; 
            box-shadow: 0 8px 20px rgba(62,39,35,0.15), inset 0 0 40px rgba(139,90,43,0.05);
        }
        .steampunk-btn { 
            background: linear-gradient(to bottom, #8b5a2b, #5c3a21); 
            color: #f4ebd0; 
            border: 2px solid #3e2723; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            transition: all 0.1s;
        }
        .steampunk-btn:active { 
            box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 2px 4px rgba(0,0,0,0.4);
            transform: translateY(2px);
        }
        .steampunk-input { 
            background: rgba(255, 255, 255, 0.8); 
            border: 2px inset #8b5a2b; 
            color: #2c1e16; 
        }
        .diary-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(139, 90, 43, 0.4) 31px, rgba(139, 90, 43, 0.4) 32px);
            line-height: 32px;
            font-size: 20px;
            padding-top: 6px;
        }
        
        /* Print layout handling */
        @media print {
            .print-hidden { display: none !important; }
            .print-block { display: block !important; }
            body { background: white; }
        }
    </style>
</head>
<body class="parchment-bg text-[#2c1e16] font-serif">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Smart Firebase Init (Falls back to local storage if config is missing on Netlify)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        let auth = null;
        let db = null;
        const appId = 'carpe-diem-ledger';

        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        }

        const Icons = {
            Trash: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Edit: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
            Print: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>,
            ArrowUp: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>,
            ArrowDown: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>,
            Bird: ({ className, style }) => <span className={className} style={{ fontSize: '1.5rem', lineHeight: 1, ...style }}>🕊️</span>,
            Koala: ({ className, style }) => <span className={className} style={{ fontSize: '1.5rem', lineHeight: 1, ...style }}>🐨</span>,
            Flame: ({ className }) => <svg className={className} fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0013 13a2.99 2.99 0 01-.879 2.121z" clipRule="evenodd" /></svg>,
            MapPin: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            CloudRain: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14v2m-4-2v2m8-2v2m-8 4v2m4-2v2m4-2v2M8 10h.01M16 10h.01M12 6h.01M7.05 10.5A5.002 5.002 0 0117 8a4.998 4.998 0 013 8.95V17a2 2 0 01-2 2H6a2 2 0 01-2-2v-.05A5.001 5.001 0 017.05 10.5z" /></svg>,
            ChevronLeft: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>,
            ChevronRight: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>,
            Star: ({ className }) => <svg className={className} fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>,
            Alert: ({ className }) => <svg className={className} fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd" /></svg>,
            Refresh: ({ className }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
        };

        const SandTimerLogo = ({ className = "" }) => (
          <svg className={className} viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="48" fill="#fdf8ed" stroke="#5C4033" strokeWidth="4"/>
            <circle cx="50" cy="50" r="42" stroke="#8b5a2b" strokeWidth="1" strokeDasharray="2 2"/>
            <rect x="28" y="15" width="44" height="8" rx="2" fill="#5C4033" />
            <rect x="28" y="77" width="44" height="8" rx="2" fill="#5C4033" />
            <path d="M 35 23 C 35 40, 48 45, 48 50 C 48 55, 35 60, 35 77 L 65 77 C 65 60, 52 55, 52 50 C 52 45, 65 40, 65 23 Z" fill="rgba(139, 90, 43, 0.1)" stroke="#8b5a2b" strokeWidth="2" />
            <path d="M 38 35 C 42 40, 48 48, 49 50 L 51 50 C 52 48, 58 40, 62 35 Z" fill="#D2B48C" />
            <path d="M 36 23 L 64 23 L 62 35 Q 50 38 38 35 Z" fill="#D2B48C" />
            <line x1="50" y1="50" x2="50" y2="70" stroke="#D2B48C" strokeWidth="2" strokeDasharray="2 2"/>
            <path d="M 40 77 C 45 60, 55 60, 60 77 Z" fill="#D2B48C" />
            <rect x="32" y="23" width="4" height="54" fill="#3E2723" />
            <rect x="64" y="23" width="4" height="54" fill="#3E2723" />
            <path d="M 38 25 Q 40 35 44 40" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.6" fill="none" />
            <path d="M 38 75 Q 40 65 44 60" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.6" fill="none" />
          </svg>
        );

        const FloralCorner = ({ position = "top-left", className = "" }) => {
          const isTop = position.includes("top");
          const isLeft = position.includes("left");
          const scaleX = isLeft ? 1 : -1;
          const scaleY = isTop ? 1 : -1;
          return (
            <svg className={className} style={{ position: 'absolute', pointerEvents: 'none', width: '250px', height: '250px', zIndex: 0, top: isTop ? '-10px' : 'auto', bottom: !isTop ? '-10px' : 'auto', left: isLeft ? '-10px' : 'auto', right: !isLeft ? '-10px' : 'auto', transform: `scaleX(${scaleX}) scaleY(${scaleY})`, opacity: 0.85 }} viewBox="0 0 200 200" fill="none">
              {/* Leaves */}
              <path d="M0,0 Q80,20 120,60 Q40,90 0,120 Z" fill="#8f9c76" />
              <path d="M0,40 Q50,80 90,70 Q60,110 10,120 Z" fill="#606f49" />
              <path d="M20,0 Q70,40 60,90 Q30,70 10,60 Z" fill="#606f49" />
              
              {/* Deep Red Vintage Flowers */}
              <circle cx="70" cy="70" r="22" fill="#8B0000" />
              <path d="M70,70 L60,48 Q70,45 80,48 Z" fill="#600000" />
              <path d="M70,70 L48,60 Q45,70 48,80 Z" fill="#600000" />
              <path d="M70,70 L80,92 Q70,95 60,92 Z" fill="#600000" />
              <path d="M70,70 L92,80 Q95,70 92,60 Z" fill="#600000" />
              <circle cx="70" cy="70" r="6" fill="#2c1e16" />
              <circle cx="70" cy="70" r="3" fill="#B8860B" />
              
              <circle cx="120" cy="30" r="15" fill="#8B0000" />
              <circle cx="120" cy="30" r="4" fill="#2c1e16" />
              <circle cx="120" cy="30" r="2" fill="#B8860B" />
              
              <circle cx="30" cy="130" r="12" fill="#8B0000" />
              <circle cx="30" cy="130" r="3" fill="#2c1e16" />
              
              {/* Vines */}
              <path d="M0,0 Q120,60 170,180" stroke="#5c4033" strokeWidth="2" fill="none" />
              <path d="M0,60 Q90,120 140,220" stroke="#5c4033" strokeWidth="1.5" fill="none" />
              <path d="M60,0 Q120,90 220,140" stroke="#5c4033" strokeWidth="1.5" fill="none" />
              
              {/* Vintage Bird */}
              <path d="M125,95 Q150,70 175,85 Q185,60 195,75 Q170,110 125,95 Z" fill="#5a6065" />
              <path d="M135,93 Q160,103 175,85 Q150,85 135,93 Z" fill="#cd5c5c" />
              <circle cx="180" cy="77" r="2" fill="#2c1e16" />
              <path d="M195,75 L200,77 L196,80 Z" fill="#2c1e16" />
            </svg>
          );
        };

        const DecorativeBorders = () => (
          <div className="absolute inset-0 pointer-events-none z-0 overflow-hidden opacity-[0.15]">
            <div className="absolute top-0 left-0 w-64 h-64 bg-[url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M10,10 Q40,20 30,50 T10,90 Q20,60 50,70 T90,90 Q70,50 90,10 Q50,30 10,10 Z%22 fill=%22none%22 stroke=%22%235C4033%22 stroke-width=%221%22/></svg>')] bg-no-repeat bg-contain" />
            <div className="absolute bottom-0 right-0 w-64 h-64 bg-[url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M90,90 Q60,80 70,50 T90,10 Q80,40 50,30 T10,10 Q30,50 10,90 Q50,70 90,90 Z%22 fill=%22none%22 stroke=%22%235C4033%22 stroke-width=%221%22/></svg>')] bg-no-repeat bg-contain" />
          </div>
        );

        const VintageLineChart = ({ data }) => {
            if (!data || data.length === 0) return null;
            const minTemp = Math.min(...data.map(d => d.temp)) - 5;
            const maxTemp = Math.max(...data.map(d => d.temp)) + 5;
            const range = maxTemp - minTemp;
            
            const points = data.map((d, i) => {
                const x = (i / (data.length - 1)) * 100;
                const y = 100 - ((d.temp - minTemp) / range) * 100;
                return `${x},${y}`;
            }).join(' ');

            return (
                <div className="w-full h-full relative pt-4 pb-6">
                    <svg viewBox="0 -15 100 135" className="w-full h-full" preserveAspectRatio="none">
                        <polyline fill="none" stroke="#8B0000" strokeWidth="1.5" points={points} />
                        {data.map((d, i) => {
                            const x = (i / (data.length - 1)) * 100;
                            const y = 100 - ((d.temp - minTemp) / range) * 100;
                            return (
                                <g key={i}>
                                    <circle cx={x} cy={y} r="2" fill="#8b5a2b" stroke="#fdf8ed" strokeWidth="0.5" />
                                    <text x={x} y={y - 5} fontSize="5" fill="#3E2723" textAnchor="middle" fontWeight="bold" fontFamily="serif">{d.temp}°</text>
                                    <text x={x} y="115" fontSize="4" fill="#8b5a2b" textAnchor="middle" fontFamily="sans-serif" fontWeight="bold">{d.time}</text>
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        };

        const generateTimeOptions = () => {
          const options = [];
          for (let h = 0; h < 24; h++) {
            for (let m = 0; m < 60; m += 15) {
              const isPM = h >= 12;
              const displayH = h % 12 === 0 ? 12 : h % 12;
              const displayM = m.toString().padStart(2, '0');
              const ampm = isPM ? 'PM' : 'AM';
              const value = `${h.toString().padStart(2, '0')}:${displayM}`;
              const label = `${displayH}:${displayM} ${ampm}`;
              options.push({ value, label });
            }
          }
          return options;
        };
        const timeOptions = generateTimeOptions();

        function App() {
          const [user, setUser] = useState(null);
          const [activeTab, setActiveTab] = useState('Plan');
          const [currentDate, setCurrentDate] = useState(new Date());
          
          const [wakeTime, setWakeTime] = useState('07:00');
          const [bedTime, setBedTime] = useState('22:00');
          const [tasks, setTasks] = useState([]);
          
          const [newTaskName, setNewTaskName] = useState('');
          const [newTaskStart, setNewTaskStart] = useState('08:00');
          const [newTaskEnd, setNewTaskEnd] = useState('09:00');
          const [newTaskBuffer, setNewTaskBuffer] = useState(0);
          const [newTaskEnergy, setNewTaskEnergy] = useState('Medium');
          
          const [editingTaskId, setEditingTaskId] = useState(null);
          const [editTaskData, setEditTaskData] = useState({});

          const [diary, setDiary] = useState('');
          const [ratings, setRatings] = useState({ goals: 5, laugh: 5, beauty: 5, gratitude: 5, mood: 5, overall: 5 });
          
          const [history, setHistory] = useState({});
          const [streak, setStreak] = useState(0);
          const [toast, setToast] = useState('');
          const [bannerError, setBannerError] = useState(false);

          const [weatherCity, setWeatherCity] = useState('');
          const [weatherData, setWeatherData] = useState(null);
          const [travelFrom, setTravelFrom] = useState('');
          const [travelTo, setTravelTo] = useState('');
          const [clearConfirm, setClearConfirm] = useState(false);

          useEffect(() => {
            const initAuth = async () => {
              if (auth) {
                  try { await auth.signInAnonymously(); } 
                  catch(e) { console.warn("Firebase Auth bypassed, using local mode."); }
              }
            };
            initAuth();
            if (auth) {
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }
          }, []);

          const dateKey = currentDate.toISOString().split('T')[0];
          
          useEffect(() => {
            const loadHistory = async () => {
              let loadedHistory = {};
              
              // 1. Always check Local Storage first (Great for Netlify!)
              const localSaved = localStorage.getItem('carpeDiemHistory');
              if (localSaved) {
                  try { loadedHistory = JSON.parse(localSaved); } catch(e) {}
              }

              // 2. Sync with Firebase if available
              if (user && db) {
                try {
                    const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                    const snap = await docRef.get();
                    if (snap.exists && snap.data().history) {
                        loadedHistory = { ...loadedHistory, ...snap.data().history };
                    }
                } catch(e) { console.warn("Firebase fetch bypassed."); }
              }
              
              setHistory(loadedHistory);
              
              // Calculate Streak
              let currentStreak = 0;
              let checkDate = new Date();
              checkDate.setDate(checkDate.getDate() - 1);
              while (true) {
                const dateStr = checkDate.toISOString().split('T')[0];
                if (loadedHistory[dateStr] && loadedHistory[dateStr].closed) {
                  currentStreak++;
                  checkDate.setDate(checkDate.getDate() - 1);
                } else break;
              }
              setStreak(currentStreak);
            };
            loadHistory();
          }, [user, currentDate]);

          useEffect(() => {
            const dayData = history[dateKey];
            if (dayData) {
              setTasks(dayData.tasks || []);
              setWakeTime(dayData.wakeTime || '07:00');
              setBedTime(dayData.bedTime || '22:00');
              setDiary(dayData.diary || '');
              setRatings(dayData.ratings || { goals: 5, laugh: 5, beauty: 5, gratitude: 5, mood: 5, overall: 5 });
            } else {
              setTasks([]);
              setWakeTime('07:00');
              setBedTime('22:00');
              setDiary('');
              setRatings({ goals: 5, laugh: 5, beauty: 5, gratitude: 5, mood: 5, overall: 5 });
            }
          }, [dateKey, history]);

          const saveDayData = async (dataToUpdate) => {
            const updatedHistory = { ...history, [dateKey]: { ...(history[dateKey] || {}), ...dataToUpdate } };
            setHistory(updatedHistory);
            
            // Save Locally
            localStorage.setItem('carpeDiemHistory', JSON.stringify(updatedHistory));
            
            // Save to Firebase
            if (user && db) {
              try {
                  const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid);
                  await docRef.set({ history: updatedHistory }, { merge: true });
              } catch(e) {}
            }
          };

          const calculateMinutes = (start, end) => {
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let diff = (eH * 60 + eM) - (sH * 60 + sM);
            if (diff < 0) diff += 1440;
            return diff;
          };

          const handleAddTask = () => {
            if (!newTaskName.trim()) return;
            const duration = calculateMinutes(newTaskStart, newTaskEnd);
            
            const newTask = {
              id: Date.now().toString(), name: newTaskName,
              startTime: newTaskStart, endTime: newTaskEnd,
              plannedMinutes: duration, bufferMinutes: newTaskBuffer,
              actualMinutes: duration, energy: newTaskEnergy,
              completed: false, notes: ''
            };
            
            const updatedTasks = [...tasks, newTask];
            setTasks(updatedTasks);
            saveDayData({ tasks: updatedTasks });
            
            setNewTaskName('');
            setNewTaskStart(newTaskEnd);
            const nextEndIdx = Math.min(timeOptions.findIndex(o => o.value === newTaskEnd) + 4, timeOptions.length - 1);
            setNewTaskEnd(timeOptions[nextEndIdx].value);
            setNewTaskBuffer(0);
            setNewTaskEnergy('Medium');
          };

          const saveEdit = (id) => {
            const duration = calculateMinutes(editTaskData.startTime, editTaskData.endTime);
            const updatedTasks = tasks.map(t => t.id === id ? { ...t, ...editTaskData, plannedMinutes: duration, actualMinutes: duration } : t);
            setTasks(updatedTasks);
            saveDayData({ tasks: updatedTasks });
            setEditingTaskId(null);
          };

          const updateTask = (id, updates) => {
            const updatedTasks = tasks.map(t => t.id === id ? { ...t, ...updates } : t);
            setTasks(updatedTasks);
            saveDayData({ tasks: updatedTasks });
          };

          const handleReflectionChange = (field, value) => {
            const newRatings = { ...ratings, [field]: value };
            const avg = Math.round((newRatings.goals + newRatings.laugh + newRatings.beauty + newRatings.gratitude + newRatings.mood) / 5);
            newRatings.overall = avg;
            setRatings(newRatings);
            saveDayData({ ratings: newRatings });
          };

          const closeDay = () => {
            saveDayData({ closed: true, diary, wakeTime, bedTime });
            setToast("Day closed and saved to your ledger.");
            setTimeout(() => setToast(''), 3000);
            setActiveTab('Summary');

                    <div className="max-w-4xl mx-auto relative z-10">
                      <h2 className="text-4xl font-bold mb-8 text-[#3E2723] border-b-[4px] border-double border-[#8b5a2b] pb-4 uppercase tracking-widest">Evening Audit</h2>
                      
                      <div className="space-y-6 mb-12 relative z-10">
                        {tasks.length === 0 && <p className="italic text-[#8b5a2b] text-xl bg-[#fdf8ed] p-6 border-2 border-[#8b5a2b] rounded text-center">No tasks charted for today.</p>}
                        {tasks.map(task => (
                          <div key={task.id} className={`p-6 border-2 rounded transition-colors shadow-[2px_2px_0px_#8b5a2b] ${task.completed ? 'border-[#2F4F4F] bg-[#E8D8C1]' : 'border-[#8b5a2b] bg-[#fdf8ed]'}`}>
                            <div className="flex items-center gap-4 mb-4">
                              <input type="checkbox" checked={task.completed} onChange={(e) => updateTask(task.id, { completed: e.target.checked })} className="w-8 h-8 rounded border-2 border-[#8b5a2b] text-[#8b5a2b] accent-[#5C4033] cursor-pointer" />
                              <h3 className={`text-2xl font-bold ${task.completed ? 'line-through text-gray-500' : 'text-[#3E2723]'}`}>{task.name}</h3>
                            </div>
                            
                            {task.completed && (
                              <div className="pl-12 grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 border-t-2 border-dashed border-[#8b5a2b] pt-4">
                                <div>
                                  <label className="block text-xs font-bold text-[#8b5a2b] mb-2 uppercase tracking-wider">Actual Time Spent (mins)</label>
                                  <input type="number" value={task.actualMinutes} onChange={(e) => updateTask(task.id, { actualMinutes: e.target.value === '' ? '' : parseInt(e.target.value) })} className="w-full p-3 border-2 border-[#8b5a2b] rounded steampunk-input font-bold font-sans" />
                                </div>
                                <div>
                                  <label className="block text-xs font-bold text-[#8b5a2b] mb-2 uppercase tracking-wider">Learnings / Notes</label>
                                  <input type="text" value={task.notes} onChange={(e) => updateTask(task.id, { notes: e.target.value })} placeholder="What went well?" className="w-full p-3 border-2 border-[#8b5a2b] rounded steampunk-input font-bold" />
                                </div>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>

                      <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border shadow-inner">
                        <h3 className="text-3xl font-bold mb-6 text-[#3E2723] border-b-2 border-[#8b5a2b] pb-2 uppercase tracking-widest">Dear Diary</h3>
                        <textarea 
                          value={diary} onChange={e => setDiary(e.target.value)}
                          placeholder="Pen your thoughts on the day's journey..."
                          className="w-full h-64 p-0 bg-transparent outline-none font-serif italic resize-none diary-lines border-l-2 border-[#8B0000] pl-4 mb-8"
                        />
                        
                        <div className="space-y-6">
                          {[
                            { key: 'goals', label: '1. Did I accomplish my goals for today?' },
                            { key: 'laugh', label: '2. Did I laugh today? And make someone laugh?' },
                            { key: 'beauty', label: '3. Did I find beauty in today?' },
                            { key: 'gratitude', label: '4. Did I practice gratitude today?' },
                            { key: 'mood', label: '5. How was my mood today?' },
                          ].map((slider) => (
                            <div key={slider.key} className="bg-[#E8D8C1] p-4 rounded border border-[#8b5a2b] shadow-inner">
                              <div className="flex justify-between mb-2 border-b border-[#8b5a2b] pb-2">
                                <label className="font-bold text-[#3E2723] text-lg">{slider.label}</label>
                                <span className="font-black text-[#8B0000] bg-[#fdf8ed] px-3 py-1 rounded border border-[#8b5a2b] font-sans">{ratings[slider.key]} / 10</span>
                              </div>
                              <input type="range" min="1" max="10" value={ratings[slider.key]} onChange={e => handleReflectionChange(slider.key, parseInt(e.target.value))} className="w-full accent-[#5C4033]" />
                            </div>
                          ))}
                        </div>

                        <div className="mt-10 pt-8 border-t-[4px] border-double border-[#8b5a2b] flex flex-col md:flex-row justify-between items-center gap-6">
                           <div className="text-3xl font-bold text-[#3E2723] uppercase bg-[#E8D8C1] px-6 py-3 rounded border border-[#8b5a2b]">Score: <span className="text-[#8B0000] ml-2">{ratings.overall}</span></div>
                           <button onClick={closeDay} className="steampunk-btn w-full md:w-auto px-10 py-4 font-bold text-xl rounded uppercase tracking-widest">Close the Day</button>
                        </div>
                      </div>
                    </div>
                  )}

                  {activeTab === 'Summary' && (
                    <div className="max-w-5xl mx-auto relative z-10">
                       <h2 className="text-4xl font-bold mb-10 text-[#3E2723] uppercase tracking-widest border-b-[4px] border-double border-[#8b5a2b] inline-block pb-2">Ledger Analytics</h2>
                       
                       <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border text-center shadow-inner relative overflow-hidden">
                           <div className="text-[#8b5a2b] uppercase font-bold text-sm mb-3 tracking-widest border-b border-[#8b5a2b] pb-2">Average Score</div>
                           <div className="text-6xl font-bold text-[#3E2723] font-sans">{averageScore}</div>
                         </div>
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border text-center shadow-inner relative overflow-hidden">
                           <div className="text-[#8b5a2b] uppercase font-bold text-sm mb-3 tracking-widest border-b border-[#8b5a2b] pb-2">Days Logged</div>
                           <div className="text-6xl font-bold text-[#3E2723] font-sans">{allClosedDays.length}</div>
                         </div>
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border text-center shadow-inner relative overflow-hidden">
                           <div className="text-[#8b5a2b] uppercase font-bold text-sm mb-3 tracking-widest border-b border-[#8b5a2b] pb-2">Estimation Accuracy</div>
                           <div className="text-4xl font-bold text-[#8B0000] mt-2 font-sans">{avgEstDiff > 0 ? `+${avgEstDiff} min` : `${avgEstDiff} min`}</div>
                         </div>
                         
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border text-center shadow-inner relative overflow-hidden">
                           <div className="text-[#8b5a2b] uppercase font-bold text-sm mb-3 tracking-widest border-b border-[#8b5a2b] pb-2">Diligence Rate</div>
                           <div className="text-5xl font-bold text-[#2F4F4F] mt-2 font-sans">{completionRate}%</div>
                         </div>
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border text-center shadow-inner relative overflow-hidden md:col-span-2">
                           <div className="text-[#8b5a2b] uppercase font-bold text-sm mb-3 tracking-widest border-b border-[#8b5a2b] pb-2">The Chrono-Vault</div>
                           <div className="text-5xl font-bold text-[#B8860B] mt-2 font-sans">{totalHoursInvested}<span className="text-2xl text-[#8b5a2b] font-serif">h</span> {remainingInvestedMinutes}<span className="text-2xl text-[#8b5a2b] font-serif">m</span></div>
                         </div>
                       </div>

                       <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border shadow-inner">
                            <h3 className="text-2xl font-bold mb-6 border-b-2 border-[#8b5a2b] pb-2 text-[#3E2723] uppercase">Energy Burn</h3>
                            <div className="h-10 w-full flex rounded border-2 border-[#8b5a2b] shadow-inner overflow-hidden">
                               <div style={{ width: `${(highEnergyTime/totalEnergyTime)*100}%` }} className="bg-[#8B0000] border-r-2 border-[#3E2723]"></div>
                               <div style={{ width: `${(medEnergyTime/totalEnergyTime)*100}%` }} className="bg-[#B8860B] border-r-2 border-[#3E2723]"></div>
                               <div style={{ width: `${(lowEnergyTime/totalEnergyTime)*100}%` }} className="bg-[#2F4F4F]"></div>
                            </div>
                            <div className="flex justify-between text-sm mt-4 font-bold font-sans">
                               <span className="text-[#8B0000]">High: {Math.round((highEnergyTime/totalEnergyTime)*100)}%</span>
                               <span className="text-[#B8860B]">Med: {Math.round((medEnergyTime/totalEnergyTime)*100)}%</span>
                               <span className="text-[#2F4F4F]">Low: {Math.round((lowEnergyTime/totalEnergyTime)*100)}%</span>
                            </div>
                         </div>

                         <div className="bg-[#fdf8ed] p-8 rounded-lg steampunk-border shadow-inner">
                            <h3 className="text-2xl font-bold mb-6 border-b-2 border-[#8b5a2b] pb-2 text-[#3E2723] uppercase">Soul's Barometer</h3>
                            <div className="space-y-4">
                              {[{ label: 'Goals', score: avgGoals, c: '#8B0000' }, { label: 'Laughter', score: avgLaugh, c: '#B8860B' }, { label: 'Beauty', score: avgBeauty, c: '#2F4F4F' }, { label: 'Gratitude', score: avgGratitude, c: '#5C4033' }, { label: 'Mood', score: avgMood, c: '#D2691E' }].map(item => (
                                <div key={item.label} className="relative">
                                  <div className="flex justify-between text-sm font-bold text-[#3E2723] mb-1 uppercase tracking-widest">
                                    <span>{item.label}</span><span className="font-sans">{item.score}/10</span>
                                  </div>
                                  <div className="h-4 w-full bg-[#E8D8C1] rounded border border-[#8b5a2b] shadow-inner overflow-hidden">
                                    <div style={{ width: `${(parseFloat(item.score)/10)*100}%`, backgroundColor: item.c }} className="h-full border-r border-[#3E2723]" />
                                  </div>
                                </div>
                              ))}
                            </div>
                         </div>
                       </div>
                    </div>
                  )}

                  {activeTab === 'Calendar' && (
                    <div className="max-w-5xl mx-auto relative z-10">
                       <div className="flex justify-between items-center mb-10 bg-[#fdf8ed] p-6 rounded-lg steampunk-border shadow-md">
                         <button onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth() - 1); setCurrentDate(d); }} className="p-3 bg-[#E8D8C1] border-2 border-[#8b5a2b] rounded hover:bg-[#F0E4D0] transition-all"><Icons.ChevronLeft className="w-8 h-8 text-[#3E2723]" /></button>
                         <h2 className="text-4xl font-bold text-[#3E2723] tracking-widest uppercase">{currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
                         <button onClick={() => { const d = new Date(currentDate); d.setMonth(d.getMonth() + 1); setCurrentDate(d); }} className="p-3 bg-[#E8D8C1] border-2 border-[#8b5a2b] rounded hover:bg-[#F0E4D0] transition-all"><Icons.ChevronRight className="w-8 h-8 text-[#3E2723]" /></button>
                       </div>
                       
                       <div className="grid grid-cols-7 gap-3">
                         {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                           <div key={day} className="text-center font-bold text-[#8b5a2b] py-3 uppercase tracking-widest border-b-[4px] border-double border-[#8b5a2b] bg-[#fdf8ed] rounded-t">{day}</div>
                         ))}
                         
                         {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay() }).map((_, i) => (
                           <div key={`empty-${i}`} className="h-32 bg-[#E8D8C1]/30 rounded border-2 border-dashed border-[#8b5a2b]/30"></div>
                         ))}
                         
                         {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate() }).map((_, i) => {
                           const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), i + 1);
                           const isToday = date.toDateString() === new Date().toDateString();
                           const isSelected = date.toDateString() === currentDate.toDateString();
                           const dStr = date.toISOString().split('T')[0];
                           const dayRecord = history[dStr];
                           const isClosed = dayRecord?.closed;
                           
                           let completionPercent = 0;
                           if (dayRecord?.tasks?.length > 0) {
                             const completed = dayRecord.tasks.filter(t => t.completed).length;
                             completionPercent = Math.round((completed / dayRecord.tasks.length) * 100);
                           }

                           return (
                             <div 
                               key={i} 
                               onClick={() => { setCurrentDate(date); setActiveTab('Plan'); }}
                               className={`h-32 border-2 rounded p-3 cursor-pointer transition-all relative flex flex-col justify-between shadow-sm
                                 ${isSelected ? 'border-[#8B0000] bg-[#f4ebd0] shadow-[0_0_15px_rgba(139,0,0,0.3)] transform scale-105 z-10' : 'border-[#8b5a2b] bg-[#fdf8ed] hover:bg-[#E8D8C1]'}
                                 ${isToday ? 'ring-4 ring-offset-2 ring-[#8b5a2b] ring-offset-[#f4ebd0]' : ''}
                               `}
                             >
                               <div className="font-bold font-sans text-2xl text-[#3E2723] border-b border-[#8b5a2b]/50 pb-1 inline-block">{i + 1}</div>
                               
                               {isClosed ? (
                                 <>
                                   <div className="absolute top-2 right-2 flex items-center gap-1 text-[#B8860B] font-bold text-sm bg-[#3E2723] px-2 py-1 rounded shadow border border-[#8b5a2b]">
                                     <Icons.Star className="w-4 h-4" /> <span className="font-sans">{dayRecord.ratings?.overall || 5}</span>
                                   </div>
                                   <div className="text-center text-xs font-bold text-[#fdf8ed] bg-[#2F4F4F] border-2 border-[#1a2d2d] rounded mt-auto w-full py-1.5 uppercase tracking-wide shadow-inner">
                                     {completionPercent}% Done
                                   </div>
                                 </>
                               ) : dayRecord?.tasks?.length > 0 ? (
                                 <div className="absolute top-3 right-3 text-[#8B0000] animate-pulse drop-shadow-md" title="Tasks pending review">
                                   <Icons.Alert className="w-6 h-6" />
                                 </div>
                               ) : null}
                             </div>
                           );
                         })}
                       </div>
                    </div>
                  )}

                </main>
              </div>

              {/* Print layout handling */}
              <div className="print-block hidden bg-white text-black p-8 font-serif">
                <div className="text-center mb-8 border-b-4 border-black pb-4">
                  <h1 className="text-4xl font-bold uppercase tracking-widest">Carpe Diem</h1>
                  <p className="text-xl italic">The Daily Ledger - {currentDate.toDateString()}</p>
                </div>
                <div className="mb-6 flex justify-between font-bold text-lg">
                  <span>Wake: {wakeTime}</span>
                  <span>Bed: {bedTime}</span>
                </div>
                <h2 className="text-2xl font-bold mb-4 border-b border-black">The Day's Journey</h2>
                <table className="w-full mb-8 text-left border-collapse">
                  <thead>
                    <tr className="border-b-2 border-black">
                      <th className="p-2">Done</th>
                      <th className="p-2">Time</th>
                      <th className="p-2">Task</th>
                      <th className="p-2">Notes</th>
                    </tr>
                  </thead>
                  <tbody>
                    {tasks.map(t => (
                      <tr key={t.id} className="border-b border-gray-300">
                        <td className="p-2 w-12 text-center">{t.completed ? '✓' : ''}</td>
                        <td className="p-2">{timeOptions.find(o=>o.value===t.startTime)?.label} - {timeOptions.find(o=>o.value===t.endTime)?.label}</td>
                        <td className="p-2">{t.name}</td>
                        <td className="p-2 italic text-sm text-gray-600">{t.notes}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <h2 className="text-2xl font-bold mb-4 border-b border-black">Evening Reflection</h2>
                <div className="border border-black p-4 min-h-[200px] mb-4 bg-gray-50">
                  <p className="italic">{diary || "No entry recorded."}</p>
                </div>
                <div className="flex justify-between font-bold">
                  <span>Overall Score: {ratings.overall} / 10</span>
                  <span>Ledger Closed</span>
                </div>
              </div>
            </>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
